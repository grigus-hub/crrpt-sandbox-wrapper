name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    name: Build DLL and create release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install vcpkg packages
        run: |
          vcpkg integrate install
          vcpkg install --clean-after-build --x-manifest-root=${{ github.workspace }}

      - name: Configure CMake
        run: cmake --preset ci -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build project
        run: cmake --build build

      - name: Prepare artifacts
        run: |
          mkdir dist
          copy build\build\corruptjpeg.dll dist\corruptjpeg_latest.dll
          copy build\build\jpeg62.dll dist\jpeg62.dll

      - name: Delete previous 'latest' release (if exists)
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create / update 'latest' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: |
            dist/corruptjpeg_latest.dll
            dist/jpeg62.dll
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}